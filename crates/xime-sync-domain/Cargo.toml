[package]
name = "xime-sync-domain"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Xime sync protocol and profile models (server + client shared)"
repository = "https://github.com/ximeiorg/libximep2p"

[dependencies]
async-trait = "0.1"
base64 = "0.23.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "signal",
    "sync",
    "time",
    "fs",
    "rt",
] }

[dev-dependencies]
tempfile = "3"
